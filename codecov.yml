coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.5%
    patch:
      default:
        target: auto
        threshold: 1%
ignore:
  # Run only from Node, by the tests of the web package (mise run web).
  - "crates/nanoflash-web"
  - "crates/nanoflash/src/web"
