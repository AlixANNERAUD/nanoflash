[tools]
# `targets` are the cross targets of the `cross` task. `mr_boxington` routes Cargo through mbx,
# a shared build cache.
rust = { version = "stable", components = "rustfmt,clippy,llvm-tools", targets = "thumbv7em-none-eabihf,wasm32-unknown-unknown", mr_boxington = true }
mr-boxington = "latest"
"aqua:taiki-e/cargo-llvm-cov" = "latest"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --all --check"

[tasks.clippy]
description = "Run clippy on the workspace, with default and all features"
env.RUSTFLAGS = "-D warnings"
run = [
  "cargo clippy --workspace --all-targets",
  "cargo clippy --workspace --all-targets --all-features",
]

[tasks.test]
description = "Run the host test suite, with default and all features"
env.RUSTFLAGS = "-D warnings"
run = [
  "cargo test --workspace",
  "cargo test --workspace --all-features",
]

[tasks.features]
description = "Test the library with no feature, with each table writer alone, with the flashing interface and the Espressif backend, and with the manifest readers"
env.RUSTFLAGS = "-D warnings"
run = [
  "cargo test -p nanoflash --no-default-features",
  "cargo test -p nanoflash --no-default-features --features table-mbr",
  "cargo test -p nanoflash --no-default-features --features table-espressif",
  "cargo test -p nanoflash --no-default-features --features table-linker",
  "cargo test -p nanoflash --no-default-features --features testing",
  "cargo test -p nanoflash --no-default-features --features flash",
  "cargo test -p nanoflash --no-default-features --features espressif",
  "cargo test -p nanoflash --no-default-features --features toml,json",
  "cargo test -p nanoflash --no-default-features --features web",
]

[tasks.msrv]
description = "Build the whole workspace with the minimum supported Rust version (1.85)"
env.RUSTFLAGS = "-D warnings"
run = [
  "mise x rust@1.85 -- cargo build --workspace --locked",
  "mise x rust@1.85 -- cargo build --workspace --locked --all-features",
]

[tasks.cross]
description = "Build the library for Cortex-M4F and WebAssembly with every no_std feature"
env.RUSTFLAGS = "-D warnings"
run = [
  "cargo build -p nanoflash --lib --target thumbv7em-none-eabihf --features toml,json,table-espressif,table-mbr,table-linker,testing,flash,espressif",
  "cargo build -p nanoflash --lib --target wasm32-unknown-unknown --features toml,json,table-espressif,table-mbr,table-linker,testing,flash,espressif,web",
]

[tasks.deny]
description = "Check licenses, security advisories, bans and sources of the dependencies (cargo-deny)"
tools = { "aqua:EmbarkStudios/cargo-deny" = "latest" }
run = "cargo deny check"

[tasks.coverage]
description = "Coverage of the workspace, written to coverage.lcov"
# mbx's build-script wrapper is turned off: llvm-cov reads every binary of the target directory
# and cannot parse it.
env.MBX_BUILD_SCRIPT_EXECUTION = "false"
run = "cargo llvm-cov --workspace --all-features --lcov --output-path coverage.lcov"

[tasks.package]
description = "Package every crate as crates.io would, and build each one from its package"
env.CARGO_TARGET_DIR = "target/package"
# Start from no previously extracted registry sources, and without mbx's build-script cache.
env.MBX_BUILD_SCRIPT_EXECUTION = "false"
run = [
  "rm -rf {{config_root}}/target/package \"${CARGO_HOME:-$HOME/.cargo}\"/registry/src/-*/nanoflash-*",
  "cargo package --workspace",
]

[tasks.external-parsers]
description = "Check the Espressif partition table writer against ESP-IDF's gen_esp32part.py"
run = [
  "mkdir -p target/external",
  "curl --fail --silent --show-error --location --output target/external/gen_esp32part.py https://raw.githubusercontent.com/espressif/esp-idf/v5.5/components/partition_table/gen_esp32part.py",
  "NANOFLASH_EXTERNAL_PARSERS=1 NANOFLASH_GEN_ESP32PART=target/external/gen_esp32part.py cargo test -p nanoflash --all-features --test external_parsers",
]

[tasks.web-wasm]
description = "Build the WebAssembly modules of the web package (core, and espressif with the Espressif backend) into web/src/wasm"
tools = { "cargo:wasm-bindgen-cli" = "0.2.130", "github:WebAssembly/binaryen" = { version = "133", version_prefix = "version_" } }
env.RUSTFLAGS = "-D warnings"
run = [
  # wasm-bindgen only reads modules built by the wasm-bindgen crate of its own version.
  '''
  locked=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)
  installed=$(wasm-bindgen --version | cut -d ' ' -f 2)
  if [ "$installed" != "$locked" ]; then
    echo "wasm-bindgen $installed is installed, Cargo.lock has the wasm-bindgen crate $locked: update the cargo:wasm-bindgen-cli tool of mise.toml" >&2
    exit 1
  fi
  ''',
  "cargo build -p nanoflash-web --target wasm32-unknown-unknown --profile wasm --no-default-features",
  "wasm-bindgen --target web --remove-name-section --remove-producers-section --out-dir web/src/wasm --out-name nanoflash_core target/wasm32-unknown-unknown/wasm/nanoflash_web.wasm",
  # Without inlining functions that have one caller, which makes the gzip of the espressif
  # module about 26 KB larger (254089 bytes against 227368 with wasm-opt 133).
  "wasm-opt -Oz --one-caller-inline-max-function-size=0 web/src/wasm/nanoflash_core_bg.wasm -o web/src/wasm/nanoflash_core_bg.wasm",
  "cargo build -p nanoflash-web --target wasm32-unknown-unknown --profile wasm --features espressif",
  "wasm-bindgen --target web --remove-name-section --remove-producers-section --out-dir web/src/wasm --out-name nanoflash_espressif target/wasm32-unknown-unknown/wasm/nanoflash_web.wasm",
  "wasm-opt -Oz --one-caller-inline-max-function-size=0 web/src/wasm/nanoflash_espressif_bg.wasm -o web/src/wasm/nanoflash_espressif_bg.wasm",
]

[tasks.web-size]
description = "Check that every WebAssembly module of the web package is at most 256000 bytes once compressed with gzip -9"
depends = ["web-wasm"]
run = """
status=0
for module in core espressif; do
  file=web/src/wasm/nanoflash_${module}_bg.wasm
  if [ ! -s "$file" ]; then
    echo "$file is missing or empty: run mise run web-wasm" >&2
    status=1
    continue
  fi
  size=$(gzip -9 -c "$file" | wc -c)
  echo "$file $size"
  if [ "$size" -eq 0 ]; then
    echo "$file could not be compressed" >&2
    status=1
  elif [ "$size" -gt 256000 ]; then
    echo "$file is $size bytes compressed, over the budget of 256000 bytes" >&2
    status=1
  fi
done
exit $status
"""

[tasks.web-test]
description = "Run the tests of the web package in Node, against a mocked Web Serial port"
depends = ["web-wasm"]
tools = { node = "22" }
run = [
  "npm --prefix web ci",
  "npm --prefix web test",
]

[tasks.web]
description = "Build the WebAssembly modules, check their size and run the tests of the web package"
depends = ["web-size", "web-test"]

[tasks.check]
description = "Everything to run before pushing"
depends = ["fmt", "clippy", "test", "cross"]

[tasks.test-qemu]
description = "Flash Espressif's QEMU (ESP32 and ESP32-C3) in download mode and replay the traffic (x86-64 or AArch64 Linux, needs libslirp)"
run = [
  "hardware/qemu/run.sh esp32",
  "hardware/qemu/run.sh esp32c3",
]

[tasks.test-hardware]
description = "Flash the boards listed in hardware/boards.toml (see hardware/README.md)"
env.NANOFLASH_HARDWARE = "hardware/boards.toml"
run = "cargo test -p nanoflash-cli --test hardware -- --ignored --nocapture"
