# Arduino Mega 2560 (ATmega2560): its bootloader never erases above 0x3BFFF (0x3C000..0x3FFFF, of which 0x3E000..0x3FFFF is the boot section itself), so the application ends at 0x3C000 and the bootloader partition starts there.
[flash]
size = "256 KiB"
base-address = 0x0
alignment = 0x100

[[partition]]
name = "application"
role = "firmware"
offset = 0x0
size = 0x3C000

[[partition]]
name = "bootloader"
role = "bootloader"
offset = 0x3C000
size = 0x4000
