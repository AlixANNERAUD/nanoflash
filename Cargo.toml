[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
authors = ["Alix ANNERAUD <alix@anneraud.fr>"]
repository = "https://github.com/AlixANNERAUD/nanoflash"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
unsafe_code = "forbid"

# The WebAssembly modules of the web package (`mise run web-wasm`), built for size.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
