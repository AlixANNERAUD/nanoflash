name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: clippy
      - run: mise run clippy

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: test
      - run: sudo apt-get install -y socat
      - run: mise run test
        env:
          NANOFLASH_REQUIRE_SOCAT: "1"

  features:
    name: Features alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: features
      - run: mise run features

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run msrv

  cross:
    name: Cross (Cortex-M4F and WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: cross
      - run: mise run cross

  # Builds the WebAssembly modules, checks their size and runs the tests of the web package in
  # Node against a mocked Web Serial port.
  web:
    name: Web package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: web
      - run: mise run web

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run deny

  # Reads the generated tables back with ESP-IDF's gen_esp32part.py and sfdisk.
  external-parsers:
    name: External parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: external-parsers
      - run: mise run external-parsers

  # Flashes Espressif's QEMU in download mode. Not required: the emulated ROM may differ from the
  # silicon, and the release is downloaded from GitHub.
  qemu:
    name: QEMU (ESP32 and ESP32-C3)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: qemu
      - run: sudo apt-get update
      - run: sudo apt-get install -y libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0
      - run: mise run test-qemu

  # Flashes arduino/BOSSA's emulated SAM-BA bootloader with nanoflash and bossac. Not required:
  # BOSSA is fetched from GitHub, and the emulator is not the real bootloader.
  samba-emulator:
    name: SAM-BA emulator (nanoflash and bossac)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: samba-emulator
      - run: mise run test-samba-emulator

  # Flashes Optiboot, ATmegaBOOT and the Mega 2560's wiring bootloader emulated by simavr. Not
  # required: the bootloaders are downloaded from GitHub, and simavr is not the chip.
  simavr:
    name: simavr (Arduino STK500 bootloaders)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: simavr
      - run: sudo apt-get update
      - run: sudo apt-get install -y --no-install-recommends libsimavr-dev
      - run: mise run test-simavr
