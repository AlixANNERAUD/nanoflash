[package]
name = "nanoflash-cli"
version = "0.1.0"
edition.workspace = true
rust-version = "1.88"
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The nanoflash command: lay out flash and write firmware to microcontroller boards."
keywords = ["flash", "embedded", "firmware", "cli"]
categories = ["command-line-utilities", "embedded"]

[[bin]]
name = "nanoflash"
path = "src/main.rs"

[dependencies]
getargs = "0.5"
getargs-derive = { version = "0.1", features = ["std"] }
nanoflash = { path = "../nanoflash", version = "0.1.0", features = ["toml", "json", "table-espressif", "table-mbr", "table-linker", "espressif", "native", "testing"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
toml = "1"

[lints]
workspace = true
