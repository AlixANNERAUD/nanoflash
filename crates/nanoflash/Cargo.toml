[package]
name = "nanoflash"
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Vendor-neutral toolkit to lay out the flash of a microcontroller board and write firmware to it."
readme = "../../README.md"
keywords = ["flash", "embedded", "partition-table", "firmware", "no-std"]
categories = ["embedded", "no-std"]

[features]
default = []
# Read layout files from TOML.
toml = ["dep:toml"]
# Read board manifests from JSON, and esp-web-tools manifests.
json = ["dep:serde_json"]
# Writers of the partition table each family needs.
table-espressif = ["dep:md-5"]
table-mbr = []
table-linker = []
# Replay and record serial sessions from transcripts.
testing = []
# The serial transport of the host, over the `serialport` crate (needs the standard library).
native = ["dep:serialport"]
# Constants and linker scripts for the `build.rs` of a firmware (needs the standard library).
build = ["toml", "table-linker"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
md-5 = { version = "0.11", optional = true, default-features = false }
serialport = { version = "4.10", optional = true, default-features = false }
serde_json = { version = "1", optional = true, default-features = false, features = ["alloc"] }
toml = { version = "1", optional = true, default-features = false, features = ["parse", "serde"] }

[lints]
workspace = true

[dev-dependencies]
esp-idf-part = "0.6"
mbrman = "0.7"
pollster = "0.4"
proptest = "1"
serde_json = "1"

[[test]]
name = "external_parsers"
required-features = ["toml", "table-espressif", "table-mbr"]

[[test]]
name = "native_pty"
required-features = ["native"]
