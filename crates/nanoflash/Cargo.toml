[package]
name = "nanoflash"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Vendor-neutral toolkit to lay out the flash of a microcontroller board and write firmware to it."
readme = "../../README.md"
keywords = ["flash", "embedded", "partition-table", "firmware", "no-std"]
categories = ["embedded", "no-std"]

[features]
default = []
# Read layout files from TOML.
toml = ["dep:toml"]
# Read board manifests from JSON, and esp-web-tools manifests.
json = ["dep:serde_json"]
# Writers of the partition table each family needs.
table-espressif = ["dep:md-5"]
table-mbr = ["dep:mbrman"]
table-linker = []
# The backend interface, its errors and progress events, shared by every protocol.
flash = ["toml", "table-espressif", "dep:sha2"]
# The Espressif ROM loader backend.
espressif = ["table-espressif", "flash", "dep:miniz_oxide"]
# The SAM-BA bootloader backend of the Arduino Nano 33 BLE and SAMD21 boards.
samba = ["flash", "dep:crc"]
# Replay and record serial sessions from transcripts.
testing = []
# The serial transport of the host, over the `serialport` crate (needs the standard library).
native = ["dep:serialport"]
# Constants and linker scripts for the `build.rs` of a firmware (needs the standard library).
build = ["toml", "table-linker"]
# The serial transport of the browser, over Web Serial (stays `no_std`).
web = ["dep:wasm-bindgen", "dep:js-sys", "dep:wasm-bindgen-futures"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
mbrman = { version = "0.7", optional = true, default-features = false }
crc = { version = "3", optional = true, default-features = false }
md-5 = { version = "0.11", optional = true, default-features = false }
miniz_oxide = { version = "0.8", optional = true, default-features = false, features = ["with-alloc"] }
sha2 = { version = "0.10", optional = true, default-features = false }
serialport = { version = "4.10", optional = true, default-features = false }
serde_json = { version = "1", optional = true, default-features = false, features = ["alloc"] }
toml = { version = "1", optional = true, default-features = false, features = ["parse", "serde"] }
wasm-bindgen = { version = "0.2.130", optional = true, default-features = false }
js-sys = { version = "0.3.107", optional = true, default-features = false }
wasm-bindgen-futures = { version = "0.4.80", optional = true, default-features = false }

[lints]
workspace = true

[dev-dependencies]
esp-idf-part = "0.6"
mbrman = "0.7"
pollster = "0.4"
proptest = "1"
serde_json = "1"

[[test]]
name = "external_parsers"
required-features = ["toml", "table-espressif", "table-mbr"]

[[test]]
name = "espressif"
required-features = ["espressif", "testing"]

[[test]]
name = "native_pty"
required-features = ["native"]

[[test]]
name = "flash"
required-features = ["espressif", "json", "testing"]

[[test]]
name = "samba"
required-features = ["samba", "testing"]
