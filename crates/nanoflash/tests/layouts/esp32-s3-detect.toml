[flash]
size = "detect"
minimum = "4 MiB"
alignment = "4 KiB"
base-address = 0x0

[[partition]]
name = "bootloader"
role = "bootloader"
offset = 0x0
size = "32 KiB"

[[partition]]
name = "partition-table"
role = "partition-table"
offset = 0x8000
size = "4 KiB"

[[partition]]
name = "nvs"
role = "custom"
size = "24 KiB"
espressif = { type = "data", subtype = "nvs" }

[[partition]]
name = "otadata"
role = "custom"
size = "8 KiB"
espressif = { type = "data", subtype = "ota" }

[[partition]]
name = "application"
role = "firmware"
size = "1 MiB"
alignment = "64 KiB"

[[partition]]
name = "ota-0"
role = "update"
slot = 0
size = "1 MiB"
alignment = "64 KiB"

[[partition]]
name = "ota-1"
role = "update"
slot = 1
size = "1 MiB"
alignment = "64 KiB"

[[partition]]
name = "storage"
role = "storage"
filesystem = "littlefs"
size = "remaining"
